services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-command-center-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ops_command_center
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "5432:5432"
    volumes:
      - ops-postgres-data:/var/lib/postgresql/data
volumes:
  ops-postgres-data:
